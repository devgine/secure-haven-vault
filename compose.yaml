# ─────────────────────────────────────────────────────────────────────────────
# Sentinel Vault — stack de production auto-hébergée
#
#   cp .env.docker.example .env   # puis renseignez les valeurs
#   docker compose up -d --build
#
# Architecture :
#   app → application Sentinel Vault (SSR + API), port 3000
#   db  → PostgreSQL 17 (volume persistant + healthcheck)
#
# L'application dialogue DIRECTEMENT avec PostgreSQL (plus de couche Supabase) :
# authentification par sessions maison (cookie httpOnly), schéma appliqué au
# premier démarrage via db/init.sql (monté dans docker-entrypoint-initdb.d).
# ─────────────────────────────────────────────────────────────────────────────

name: sentinel-vault

services:
  app:
    build:
      context: .
    image: sentinel-vault:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Connexion PostgreSQL directe (réseau interne du compose)
      DATABASE_URL: postgres://${POSTGRES_USER:-vault}:${POSTGRES_PASSWORD:?renseignez POSTGRES_PASSWORD dans .env}@db:5432/${POSTGRES_DB:-vault}
      # Clé maître de chiffrement AES-256-GCM : openssl rand -hex 32
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?générez une clé : openssl rand -hex 32}
      PORT: "3000"
      HOST: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/public/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?renseignez POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-vault}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schéma appliqué automatiquement au premier démarrage (base vierge)
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Décommentez pour administrer la base depuis l'hôte (psql, outils) :
    # ports:
    #   - "5432:5432"

volumes:
  pgdata:
