# ─────────────────────────────────────────────────────────────────────────────
# Sentinel Vault — stack de production auto-hébergée
#
#   cp .env.docker.example .env   # puis renseignez les valeurs
#   docker compose up -d --build
#
# Architecture :
#   app → application Sentinel Vault (SSR + API), port 3000
#   db  → PostgreSQL 17 (volume persistant + healthcheck)
#
# L'application dialogue DIRECTEMENT avec PostgreSQL (plus de couche Supabase) :
# authentification par sessions maison (cookie httpOnly), schéma appliqué au
# premier démarrage via db/init.sql (monté dans docker-entrypoint-initdb.d).
# ─────────────────────────────────────────────────────────────────────────────

name: sentinel-vault

services:
  app:
    container_name: ${PROJECT_NAME}_app
    build:
      context: .
    image: sentinel-vault:latest
    restart: unless-stopped
    environment:
      # Connexion PostgreSQL directe. Par défaut : le service `db` du compose.
      # Renseignez DATABASE_URL dans .env pour viser un PostgreSQL externe.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-vault}:${POSTGRES_PASSWORD:?renseignez POSTGRES_PASSWORD dans .env}@db:5432/${POSTGRES_DB:-vault}}
      # Clé maître de chiffrement AES-256-GCM : openssl rand -hex 32
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      PORT: "3000"
      HOST: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.${PROJECT_NAME}-app.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.${PROJECT_NAME}-app.entrypoints=websecure
      - traefik.http.routers.${PROJECT_NAME}-app.tls=true
      - traefik.http.services.${PROJECT_NAME}-app.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/public/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal
      - traefik-network

  db:
    container_name: ${PROJECT_NAME}_db
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?renseignez POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-vault}
    volumes:
      - pgdata:/var/lib/postgresql
      # Schéma appliqué automatiquement au premier démarrage (base vierge)
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
  traefik-network:
    external: true
    name: ${TRAEFIK_NETWORK}
