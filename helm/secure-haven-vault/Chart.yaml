apiVersion: v2
name: secure-haven-vault
description: Helm chart for Secure Haven Vault and its optional CloudNativePG database
type: application
version: 1.0.0
# Version de l'application = tag de l'image publiée par la CI (tag git vX.Y.Z).
# À incrémenter à chaque release ; sert de tag par défaut quand image.tag est vide.
appVersion: "0.5.0"
kubeVersion: ">=1.27.0-0"

dependencies:
  - name: prometheus-postgres-exporter
    version: 8.2.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus-postgres-exporter.enabled
