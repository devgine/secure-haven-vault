apiVersion: v2
name: secure-haven-vault
description: Helm chart for Secure Haven Vault and its optional PostgreSQL database
type: application
version: 0.9.0
appVersion: "latest"
kubeVersion: ">=1.27.0-0"

dependencies:
  - name: prometheus-postgres-exporter
    version: 8.2.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus-postgres-exporter.enabled
