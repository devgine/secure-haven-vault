{{- if .Values.postgresql.enabled }}
# Base PostgreSQL gérée par l'opérateur CloudNativePG : bascule automatique,
# mises à jour progressives, sauvegardes continues. Le schéma est créé et migré
# par l'application elle-même à son démarrage.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "secure-haven-vault.postgresqlName" . }}
  labels:
    {{- include "secure-haven-vault.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgresql.instances }}
  {{- with .Values.postgresql.imageName }}
  imageName: {{ . | quote }}
  {{- end }}
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: {{ .Values.postgresql.auth.database | quote }}
      owner: {{ .Values.postgresql.auth.username | quote }}
      secret:
        name: {{ include "secure-haven-vault.postgresqlSecretName" . }}
  {{- if include "secure-haven-vault.metricsEnabled" . }}
  managed:
    roles:
      - name: {{ .Values.postgresql.metricsRole.name | quote }}
        ensure: present
        login: true
        comment: Read-only metrics role (secret_expiry_metrics view only)
        passwordSecret:
          name: {{ include "secure-haven-vault.metricsSecretName" . }}
  {{- end }}
  storage:
    size: {{ .Values.postgresql.storage.size }}
    {{- with .Values.postgresql.storage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  resources:
    {{- toYaml .Values.postgresql.resources | nindent 4 }}
  {{- with .Values.postgresql.parameters }}
  postgresql:
    parameters:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  monitoring:
    enablePodMonitor: {{ .Values.postgresql.enablePodMonitor }}
  {{- with .Values.postgresql.backup }}
  backup:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.postgresql.scheduledBackup.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "secure-haven-vault.postgresqlName" . }}
  labels:
    {{- include "secure-haven-vault.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.postgresql.scheduledBackup.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: {{ include "secure-haven-vault.postgresqlName" . }}
{{- end }}
{{- end }}
