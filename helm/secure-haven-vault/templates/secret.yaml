{{- if not .Values.config.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "secure-haven-vault.appSecretName" . }}
  labels:
    {{- include "secure-haven-vault.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.config.masterEncryptionKeyKey }}: {{ required "config.masterEncryptionKey is required when config.existingSecret is empty" .Values.config.masterEncryptionKey | quote }}
  {{- if not .Values.postgresql.enabled }}
  {{ .Values.config.databaseUrlKey }}: {{ required "externalDatabase.url is required when postgresql.enabled=false" .Values.externalDatabase.url | quote }}
  {{- end }}
  {{- with .Values.config.admin.password }}
  {{ $.Values.config.admin.passwordKey }}: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "secure-haven-vault.postgresqlSecretName" . }}
  labels:
    {{- include "secure-haven-vault.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgresql.auth.username | quote }}
  password: {{ required "postgresql.auth.password is required when postgresql.auth.existingSecret is empty" .Values.postgresql.auth.password | quote }}
{{- end }}
{{- if and .Values.postgresql.enabled (include "secure-haven-vault.metricsEnabled" .) (not .Values.postgresql.metricsRole.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "secure-haven-vault.metricsSecretName" . }}
  labels:
    {{- include "secure-haven-vault.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgresql.metricsRole.name | quote }}
  password: {{ required "postgresql.metricsRole.password is required when the exporter is enabled without postgresql.metricsRole.existingSecret" .Values.postgresql.metricsRole.password | quote }}
{{- end }}
