{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "secure-haven-vault.fullname" . }}
  labels:
    {{- include "secure-haven-vault.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "secure-haven-vault.selectorLabels" . | nindent 6 }}
{{- end }}
